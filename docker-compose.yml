services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports: ["${DB_HOST_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  kafka:
    image: apache/kafka:3.9.1
    ports: ["${KAFKA_HOST_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,DOCKER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_HOST_PORT:-9092},DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck: {test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"], interval: 10s, timeout: 10s, retries: 10}
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "${RABBITMQ_HOST_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-labuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-labpass}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: .
    ports: ["${BACKEND_HOST_PORT:-8080}:8080"]
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: order-notification-group
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-labuser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-labpass}
      LAB_NOTIFICATION_FAIL: ${LAB_NOTIFICATION_FAIL:-false}
      LAB_RETRY_BACKOFF_MS: ${LAB_RETRY_BACKOFF_MS:-1000}
      OUTBOX_SIMULATE_KAFKA_FAILURE: ${OUTBOX_SIMULATE_KAFKA_FAILURE:-false}
      OUTBOX_MAX_RETRY: ${OUTBOX_MAX_RETRY:-5}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
volumes:
  postgres_data:
