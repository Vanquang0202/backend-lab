spring:
  application.name: order-lab
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USER:orderuser}
    password: ${DB_PASSWORD:orderpass}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.format_sql: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_GROUP_ID:order-notification-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: com.example.orderlab.*
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONCURRENCY:1}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:labuser}
    password: ${RABBITMQ_PASSWORD:labpass}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
  cache.type: redis
server.port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info,metrics
management.endpoint.health.show-details: always
app:
  kafka.topic: ${ORDER_TOPIC:order-created}
  kafka.idempotency-topic: ${IDEMPOTENCY_TOPIC:idempotency-lab}
  kafka.idempotency-group: ${IDEMPOTENCY_GROUP_ID:idempotency-lab-group}
  resilience:
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8080/fake-payment}
    payment-timeout:
      connect-ms: ${PAYMENT_CONNECT_TIMEOUT_MS:2000}
      read-ms: ${PAYMENT_READ_TIMEOUT_MS:3000}
  outbox:
    simulate-kafka-failure: ${OUTBOX_SIMULATE_KAFKA_FAILURE:false}
    max-retry: ${OUTBOX_MAX_RETRY:5}
    publisher-delay-ms: ${OUTBOX_PUBLISHER_DELAY_MS:2000}
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:10}
  notification.fail: ${LAB_NOTIFICATION_FAIL:false}
  notification.retry-backoff-ms: ${LAB_RETRY_BACKOFF_MS:1000}
  rabbit:
    exchange: ${RABBITMQ_EXCHANGE:lab.jobs.exchange}
    queue: ${RABBITMQ_QUEUE:lab.jobs.queue}
    routing-key: ${RABBITMQ_ROUTING_KEY:lab.jobs}
    dlx: ${RABBITMQ_DLX:lab.jobs.dlx}
    dlq: ${RABBITMQ_DLQ:lab.jobs.dlq}
    processing-delay-ms: ${RABBITMQ_PROCESSING_DELAY_MS:2000}
    retry-backoff-ms: ${RABBITMQ_RETRY_BACKOFF_MS:1000}
resilience4j:
  retry:
    instances:
      paymentRetry:
        max-attempts: ${PAYMENT_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${PAYMENT_RETRY_WAIT:1s}
        retry-exceptions:
          - com.example.orderlab.resilience.PaymentTimeoutException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      paymentCircuitBreaker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${PAYMENT_CB_WINDOW_SIZE:4}
        minimum-number-of-calls: ${PAYMENT_CB_MIN_CALLS:4}
        failure-rate-threshold: ${PAYMENT_CB_FAILURE_THRESHOLD:50}
        wait-duration-in-open-state: ${PAYMENT_CB_OPEN_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: ${PAYMENT_CB_HALF_OPEN_CALLS:2}
        automatic-transition-from-open-to-half-open-enabled: true
logging.level.com.example.orderlab: INFO
