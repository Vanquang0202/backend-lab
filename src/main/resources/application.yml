spring:
  application.name: order-lab
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USER:orderuser}
    password: ${DB_PASSWORD:orderpass}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.format_sql: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_GROUP_ID:order-notification-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: com.example.orderlab.*
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONCURRENCY:1}
  cache.type: redis
server.port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info,metrics
management.endpoint.health.show-details: always
app:
  kafka.topic: ${ORDER_TOPIC:order-created}
  notification.fail: ${LAB_NOTIFICATION_FAIL:false}
  notification.retry-backoff-ms: ${LAB_RETRY_BACKOFF_MS:1000}
logging.level.com.example.orderlab: INFO
